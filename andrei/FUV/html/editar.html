<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../estilo.css">
    <title>Editar Recibo</title>
</head>
<body>

    <form id="form-editar">
        <h2>Editar Recibo</h2>
        <input type="text" id="id" readonly hidden><br>
        
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" required>

        <div class="fecha-container">
            <label for="dia">Día:</label>
            <input type="number" id="dia" min="1" max="31" required>

            <label for="mes">Mes:</label>
            <input type="number" id="mes" min="1" max="12" required>

            <label for="anio">Año:</label>
            <input type="number" id="anio" min="1900" max="2100" required>
        </div>

        <label for="moneda">Moneda:</label>
        <select id="moneda" required onchange="updateMonedaNombre()">
            <option value="UYU" data-nombre="Pesos Uruguayos">UYU</option>
            <option value="USD" data-nombre="Dólares Estadounidenses">USD</option>
            <option value="EUR" data-nombre="Euros">EUR</option>
            <option value="CHF" data-nombre="Francos Suizos">CHF</option>
        </select>

        <input type="hidden" id="moneda_nombre" name="moneda_nombre">

        <label for="monto">Monto:</label>
        <input type="number" id="monto" required>

        <label for="monto_letra">Monto en Letra:</label>
        <input type="text" id="monto_letra" readonly>

<label for="concepto">Concepto: <span id="contador">0/200</span></label>
<textarea id="concepto" required maxlength="200"></textarea>

        <label for="banco">Banco:</label>
        <input type="text" id="banco" required>

        <label for="metodo_pago">Método de Pago:</label>
        <select id="metodo_pago" required>
            <option value="efectivo">Efectivo</option>
            <option value="tarjeta">Tarjeta</option>
            <option value="transferencia">Transferencia</option>
            <option value="cheque">Cheque</option>
        </select>
        <input type="text" id="estado" readonly hidden><br>

        <button type="button" onclick="guardarCambios()">Guardar cambios</button>
        <a href="VerRecibo.html" class="btn btn-primary">Volver al Menú</a>
    </form>

    <script src="../js/editar.js"></script>
</body>
</html>
